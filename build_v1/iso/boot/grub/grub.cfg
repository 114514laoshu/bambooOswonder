# Bamboo OS GRUB Configuration
# Bamboo OS GRUB 配置文件

set timeout=3
set default=0

menuentry "Bamboo OS Wonder" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.tar
    boot
}

menuentry "Bamboo OS Wonder (Safe Mode)" {
    multiboot2 /boot/kernel.elf safemode
    module2 /boot/initrd.tar
    boot
}

menuentry "Memory Test" {
    multiboot2 /boot/kernel.elf memtest
    boot
}
